version: "3.8"

services:
  postgres-db:
    image: postgres:16
    container_name: openbread-postgres
    environment:
      POSTGRES_DB: openbread
      POSTGRES_USER: openbread
      POSTGRES_PASSWORD: openbread
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  backend-app:
    image: ghcr.io/eduardoabenante/openbread/openbread-backend:latest
    container_name: openbread-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/openbread
      DB_USERNAME: openbread
      DB_PASSWORD: openbread
    
    depends_on:
      - postgres-db

volumes:
  pgdata:
    