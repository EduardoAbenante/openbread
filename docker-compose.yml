version: "3.8"

services:
  postgres-db:
    image: postgres:16
    container_name: openbread-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openbread
      POSTGRES_USER: openbread
      POSTGRES_PASSWORD: openbread
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  backend-app:
    image: ghcr.io/eduardoabenante/openbread/openbread-backend:latest
    container_name: openbread-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/openbread
      - DB_USERNAME=openbread
      - DB_PASSWORD=openbread
      - APP_UPLOAD_DIR=/home/springuser/uploads
    volumes:
      - openbread-uploads:/home/springuser/uploads 
    depends_on:
      - postgres-db

  frontend-app:
    image: ghcr.io/eduardoabenante/openbread/openbread-frontend:latest
    container_name: openbread-frontend
    ports:
      - "80:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-app

volumes:
  pgdata:
  openbread-uploads: 